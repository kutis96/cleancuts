name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # The same script that runs locally (`make ci` or `sh scripts/ci.sh`),
      # so CI and local are identical.
      - name: CI (gofmt, vet, test, build)
        run: sh scripts/ci.sh
